name: Development CI

# when the cod eis pushed or pulled to the developemnt branch the trigge the action for the developemnt
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

  #  give the permission read-only permisiion to the github workflows
  permission:
    contents: read

  #  task the github actions will execute
  docker-build:
    name: Test and Build the docke images

    # use the ubuntu as the runner
    runs-on: ubuntu-latest

    # steps to execute shyrconualusy
    steps:
      # Download the repo source code to the runner ---step -1
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Install node.js as required for the nestjs and react --- setp -2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # veryfy nodejs, pnpm and Docker availability
      - name: Check Tool Versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      # Install dependencies using the backend lockfile
      - name: Install Backend Dependencies
        working-directory: ./server
        run: pnpm install --frozen-lockfile

      # Runs the test script defined in server/package.json.
      - name: Run Backend Tests
        working-directory: ./server
        run: pnpm test -- --runInBand

      # Install dependencies using the frontend lockfile.
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      # Assumes the frontend uses Vitest.
      - name: Run Frontend Tests
        working-directory: ./frontend
        run: pnpm test -- --run

      # Create the files referenced by docker-compose.dev.yml.
      - name: Prepare Environment Files
        run: |
          mkdir -p docker
          touch docker/.env.development
          touch server/.env.development
          touch frontend/.env.development

      # Build frontend and backend images using Compose.
      - name: Build Docker Images
        run: |
          docker compose -f docker-compose.dev.yml build
