
services:
  # PostgreSQL production database
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    restart: unless-stopped

    env_file:
      - ./docker/postgres.prod.env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - gym-network

  # NestJS backend instance 1
  backend-1:
    build:
      context: ./server
      dockerfile: Dockerfile.prod

    container_name: gym-backend-1
    restart: unless-stopped

    env_file:
      - ./server/.env.production

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - gym-network

  # NestJS backend instance 2
  backend-2:
    build:
      context: ./server
      dockerfile: Dockerfile.prod

    container_name: gym-backend-2
    restart: unless-stopped

    env_file:
      - ./server/.env.production

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - gym-network

  # NestJS backend instance 3
  backend-3:
    build:
      context: ./server
      dockerfile: Dockerfile.prod

    container_name: gym-backend-3
    restart: unless-stopped

    env_file:
      - ./server/.env.production

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - gym-network

  # React production frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api

    container_name: gym-frontend
    restart: unless-stopped

    expose:
      - "80"

    networks:
      - gym-network

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: gym-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3

    networks:
      - gym-network

volumes:
  postgres_data:

networks:
  gym-network:
    driver: bridge
