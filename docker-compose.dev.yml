
services:
  # PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    container_name: dev-database
    restart: unless-stopped

    # PostgreSQL initialization environment
    env_file:
      - ./server/.env.development

    # Host access for pgAdmin or local database clients
    ports:
      - "5432:5432"

    # in watch mode just fo rthe developemnt
    develop:
      watch:
        - action: sync
          path: ./server/src
          target: /app/src
          ignore:
            - node_modules/

        - action: rebuild
          path: ./server/package.json

    # Persistent database storage
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # PostgreSQL readiness check
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - service-project

  # NestJS backend instance 1
  backend-1:
    build:
      context: ./server
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    env_file:
      - ./server/.env.development

    expose:
      - "8000"

    volumes:
      - ./server:/app
      - backend_node_modules_1:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - service-project

  # NestJS backend instance 2
  backend-2:
    build:
      context: ./server
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    env_file:
      - ./server/.env.development

    expose:
      - "8000"

    volumes:
      - ./server:/app
      - backend_node_modules_2:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - service-project

  # NestJS backend instance 3
  backend-3:
    build:
      context: ./server
      dockerfile: Dockerfile.dev

    restart: unless-stopped

    env_file:
      - ./server/.env.development

    expose:
      - "8000"

    volumes:
      - ./server:/app
      - backend_node_modules_3:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - service-project

  # React frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: service-project-frontend
    restart: unless-stopped

    env_file:
      - ./frontend/.env.development

    ports:
      - "5173:5173"

    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src

        - action: sync
          path: ./client/public
          target: /app/public

        - action: rebuild
          path: ./client/package.json

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - service-project

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: service-project-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3

    networks:
      - service-project

# Named Docker volumes
volumes:
  postgres_data:
  backend_node_modules_1:
  backend_node_modules_2:
  backend_node_modules_3:
  frontend_node_modules:

# Shared Docker network
networks:
  service-project:
    driver: bridge
