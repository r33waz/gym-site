
name: Development CI

# Trigger on push or pull request targeting dev.
"on":
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

# Read-only repository permission.
permissions:
  contents: read

jobs:
  docker-build:
    name: Test and Build Docker Images
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository.
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Setup Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Step 3: Setup pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Step 4: Check installed tools.
      - name: Check Tool Versions
        run: |
          node --version
          pnpm --version
          docker --version
          docker compose version

      # Step 5: Install backend dependencies.
      - name: Install Backend Dependencies
        working-directory: ./server
        run: pnpm install --frozen-lockfile

      # Step 6: Run backend Jest tests.
      - name: Run Backend Tests
        working-directory: ./server
        run: pnpm exec jest --runInBand --passWithNoTests

      # Step 7: Prepare environment files.
      - name: Prepare Environment Files
        run: |
          mkdir -p docker
          touch docker/.env.development
          touch server/.env.development
          touch frontend/.env.development

      # Step 8: Build Docker images.
      - name: Build Docker Images
        run: docker compose -f docker-compose.dev.yml build
